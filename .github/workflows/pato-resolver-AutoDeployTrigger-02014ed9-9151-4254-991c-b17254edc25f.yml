name: Trigger auto deployment for pato-resolver

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/pato-resolver-AutoDeployTrigger-02014ed9-9151-4254-991c-b17254edc25f.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.PATORESOLVER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PATORESOLVER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PATORESOLVER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: patoresolver.azurecr.io
          registryUsername: ${{ secrets.PATORESOLVER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.PATORESOLVER_REGISTRY_PASSWORD }}
          containerAppName: pato-resolver
          resourceGroup: pato
          imageToBuild: patoresolver.azurecr.io/pato-resolver:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


